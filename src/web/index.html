<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repos &amp; Dungeons</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="stage"></div>
    <div id="vignette"></div>
    <div id="offscreen"></div>
    <div id="bubbles"></div>
    <header id="hud-top">
      <div id="party"></div>
      <div id="sound" class="pn">
        <button id="snd" title="Sound (M)">🔇</button>
        <button id="snd-more" title="Volume">▾</button>
        <div id="mixer" hidden>
          <label>Master <input type="range" min="0" max="1" step="0.05" data-k="master" /></label>
          <label>Music <input type="range" min="0" max="1" step="0.05" data-k="music" /></label>
          <label>Effects <input type="range" min="0" max="1" step="0.05" data-k="sfx" /></label>
        </div>
      </div>
      <div id="meters" class="pn"></div>
    </header>
    <div id="log" class="pn" style="display:none"></div>
    <div id="status">connecting…</div>
    <div id="hint">drag to pan · scroll to zoom · / jump · esc follow · m sound</div>
    <canvas id="minimap" class="pn"></canvas>
    <div id="search" class="pn" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
